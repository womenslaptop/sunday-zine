<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SUNDAY ZINE Vol.2 — AUTOSAVE</title>

  <link
    rel="stylesheet"
    href="style.css?v=7"
  >
</head>

<body>

  <header>
    <div>SUNDAY ZINE Vol.2</div>
    <div>AUTOSAVE / 2026</div>
  </header>


  <main>

    <div
      id="status"
      aria-live="polite"
    >
      표지를 불러오는 중...
    </div>

    <div id="book"></div>

  </main>


  <nav
    id="controls"
    hidden
  >

    <button
      id="prev"
      type="button"
      aria-label="이전 페이지"
    >
      ←
    </button>

    <div id="page-counter">
      01 / 44
    </div>

    <button
      id="next"
      type="button"
      aria-label="다음 페이지"
    >
      →
    </button>

  </nav>


  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <script src="script.js?v=8"></script>

</body>
</html>
